<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3d2b" />
      <stop offset="100%" stop-color="#12251a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cf7a" />
      <stop offset="100%" stop-color="#d9822b" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#f5e6d3" />
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#c59b48" stroke-width="2.5" />

  <!-- Steam lines -->
  <path d="M25 18 C23 15, 27 13, 25 10" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M32 17 C30 14, 34 12, 32 8" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M39 18 C37 15, 41 13, 39 10" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Coffee cup body -->
  <path d="M18 24 H42 V35 C42 41.6 36.6 47 30 47 C23.4 47 18 41.6 18 35 Z" fill="url(#cupGrad)" stroke="#c59b48" stroke-width="1.5" />

  <!-- Cup handle -->
  <path d="M42 27 H46 C48.5 27 50.5 29 50.5 31.5 C50.5 34 48.5 36 46 36 H42" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Coffee beverage inside -->
  <path d="M21 27 C24 28.5, 36 28.5, 39 27" stroke="#8b5226" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Organic leaf / heart motif on cup -->
  <path d="M30 33 C33 30, 36 32, 36 34.5 C36 37, 30 40, 30 40 C30 40, 24 37, 24 34.5 C24 32, 27 30, 30 33 Z" fill="url(#goldGrad)" />

  <!-- Saucer -->
  <path d="M14 50 C22 53, 38 53, 46 50" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
